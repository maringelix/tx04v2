# ---------------------------------------------------------------------------
# fake-gpu-node.yaml — TEMPLATE for a single KWOK fake GPU node.
#
# create-fake-nodes.sh stamps out N copies of this with unique names. Read this
# to understand the anatomy of a KWOK node:
#   * annotation kwok.x-k8s.io/node=fake  -> the kwok-controller "adopts" this
#     Node and starts writing its heartbeat/status (a real kubelet would).
#   * label type=kwok                     -> our nodeSelector target so real
#     workloads don't accidentally land here.
#   * a NoSchedule taint                  -> belt-and-suspenders: only pods that
#     explicitly tolerate kwok.x-k8s.io/node land on fake nodes.
#   * status.capacity/allocatable         -> we DECLARE 8x A100-class GPUs and
#     lots of CPU/RAM. The scheduler believes this and will place GPU pods here.
#     (nvidia.com/gpu is an integer extended resource — no fractions.)
#
# NOTE: __NODE_NAME__ is substituted by create-fake-nodes.sh.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Node
metadata:
  name: __NODE_NAME__
  annotations:
    kwok.x-k8s.io/node: fake
    node.alpha.kubernetes.io/ttl: "0"
  labels:
    beta.kubernetes.io/arch: amd64
    beta.kubernetes.io/os: linux
    kubernetes.io/arch: amd64
    kubernetes.io/os: linux
    kubernetes.io/hostname: __NODE_NAME__
    kubernetes.io/role: agent
    node-role.kubernetes.io/agent: ""
    type: kwok
    node.tx04v2.io/pool: gpu-kwok
    nvidia.com/gpu.present: "true"
    nvidia.com/gpu.product: NVIDIA-A100-SXM4-40GB
spec:
  taints:
    - key: kwok.x-k8s.io/node
      value: fake
      effect: NoSchedule
status:
  allocatable:
    cpu: "64"
    memory: 256Gi
    pods: "110"
    nvidia.com/gpu: "8"
  capacity:
    cpu: "64"
    memory: 256Gi
    pods: "110"
    nvidia.com/gpu: "8"
  nodeInfo:
    architecture: amd64
    operatingSystem: linux
    kubeletVersion: fake
  phase: Running

# ---------------------------------------------------------------------------
# dns-storm.yaml — hammer CoreDNS the way a distributed job does.
#
# 20 pods each loop resolving an EXTERNAL name and an in-cluster Service name.
# Because the default resolv.conf has `options ndots:5` + a multi-entry `search`
# list, "api.github.com" (3 dots) is first tried as
# api.github.com.<ns>.svc.cluster.local, .svc.cluster.local, .cluster.local
# (all NXDOMAIN) before the real lookup -> ~4-5x query amplification. Multiply by
# workers and you saturate CoreDNS.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: scenario-c
  labels:
    app.kubernetes.io/part-of: tx04v2-lab
    tx04v2.scenario: c-dns-conntrack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-storm
  namespace: scenario-c
  labels:
    tx04v2.scenario: c-dns-conntrack
spec:
  replicas: 20
  selector:
    matchLabels:
      app: dns-storm
  template:
    metadata:
      labels:
        app: dns-storm
    spec:
      containers:
        - name: resolver
          image: busybox:1.37
          command:
            - sh
            - -c
            - "while true; do nslookup api.github.com >/dev/null 2>&1; nslookup mock-llm.serving >/dev/null 2>&1; done"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
